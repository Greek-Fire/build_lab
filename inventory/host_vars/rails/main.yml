ipaadmin_password: "{{ idmadmin_password }}"
rhsm_enable_repos: 
- name: rhel-9-for-x86_64-baseos-rpms
  state: enabled
- name: rhel-9-for-x86_64-appstream-rpms
  state: enabled
- name: satellite-6.18-for-rhel-9-x86_64-rpms
  state: enabled
- name: satellite-maintenance-6.18-for-rhel-9-x86_64-rpms
  state: enabled

rhc_repositories: "{{ rhsm_enable_repos | default([]) }}"
rhc_insights:
  state: absent
rhc_auth:
  login:
    username: "{{ rhsm_username }}"
    password: "{{ rhsm_password }}"

network_connections:
- name: enp1s0
  interface_name: enp1s0
  type: ethernet
  state: up
  autoconnect: true
  ip:
    dhcp4: false
    auto6: false
    address:
    - 192.168.11.31/24
    gateway4: 192.168.11.1
    dns: 192.168.11.21


rails_app_name: controls
rails_app_base_dir: /opt/apps
rails_app_root: "{{ rails_app_base_dir }}/{{ rails_app_name }}"

rails_app_owner: rubydev 
rails_app_group: rubydev

rails_app_db_user: controls
rails_app_db_password: redhat
rails_app_db_name: controls_development
rails_app_db_test_name: controls_test

rails_app_db_host: localhost
rails_app_db_port: 5432