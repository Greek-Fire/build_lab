- name: satellite
  fqdn: satellite.lab.lou
  ip: 192.168.11.11
  netmask: 255.255.255.0
  gateway: 192.168.11.1
  nameserver: 192.168.11.1
  memory_mb: 20480
  vcpus: 4
  disk_gb: 300
  internet: 192.168.11.0
  ks_dir: "{{ libvirt_storage_pool_path }}/kickstarts"
  iso_dir: "{{ libvirt_storage_pool_path }}/boot"
  ks_file: ks.cfg
  ks_iso: satellite-ks.iso
  rhel9_bootiso: "{{ libvirt_storage_pool_path }}/boot/rhel-9.7-x86_64-dvd.iso"

network_connections:
- name: eno1
  interface_name: eno1
  type: ethernet
  state: up
  autoconnect: true
  ip:
    dhcp4: false
    auto6: false
    address:
    - 192.168.1.21/24
    gateway4: 192.168.1.1
    dns: 192.168.1.1
    dns_search: lab.lou