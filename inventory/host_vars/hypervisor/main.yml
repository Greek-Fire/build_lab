rhsm_auto_attach: true
rhsm_force_register: false

firewall:
- service: ssh
  zone: public
  state: enabled
  permanent: true
  runtime: true
- service: https
  zone: public
  state: enabled
  permanent: true
  runtime: true
- service: cockpit
  zone: public
  state: enabled
  permanent: true
  runtime: true
- masquerade: true
  zone: public
  state: enabled
  permanent: true
  runtime: true

# Repos to enable after registration, if needed
rhsm_enable_repos: 
- name: rhel-9-for-x86_64-baseos-rpms
  state: enabled
- name: rhel-9-for-x86_64-appstream-rpms
  state: enabled

# Kernel/package checks
expected_kernel_major: "5"
fail_if_not_rhel: true
admin_user: greek_fire
# Virtualization packages for RHEL 9
virtualization_packages:
- lorax
- genisoimage
- pykickstart
- qemu-kvm
- libvirt
- virt-install
- virt-viewer
- virt-manager
- guestfs-tools
- virt-top
- cockpit
- cockpit-machines
- policycoreutils
- policycoreutils-python-utils

libvirt_storage_pool_name: default
libvirt_storage_pool_path: /var/lib/libvirt/images
libvirt_storage_pool_type: dir
libvirt_image_owner: qemu
libvirt_image_group: root 

libvirt_default_network:
- name: 192.168.111.0 
  bridge: virbr111
  network: 192.168.111.0
  netmask: 255.255.255.0
  gateway: 192.168.111.1
  xml_network_path: /tmp/libvirt-network-111.xml
- name: 192.168.11.0 
  nat: true
  bridge: virbr11
  dns_servers:
  - 192.168.1.1
  network: 192.168.11.0
  netmask: 255.255.255.0
  gateway: 192.168.11.1
  xml_network_path: /tmp/libvirt-network-11.xml
  xml_content: 

vms:
- name: rails 
  fqdn: rails.lab.lou
  ip: 192.168.11.31
  netmask: 255.255.255.0
  gateway: 192.168.11.1
  nameserver: 192.168.11.21
  memory_mb: 8192 
  vcpus: 4
  disk_gb: 100 
  internet: 192.168.11.0
  ks_dir: "{{ libvirt_storage_pool_path }}/kickstarts"
  iso_dir: "{{ libvirt_storage_pool_path }}/boot"
  ks_file: ks.cfg
  ks_iso: rails-ks.iso
  rhel9_bootiso: "{{ libvirt_storage_pool_path }}/boot/rhel-9.7-x86_64-dvd.iso"
