---

- name: Ensure PostgreSQL module stream is enabled
  ansible.builtin.command:
    cmd: "dnf -y module enable {{ rails_app_postgresql_module }}"
  register: rails_app_pg_module_enable
  changed_when: >
    'Enabling module streams' in rails_app_pg_module_enable.stdout or
    'Complete!' in rails_app_pg_module_enable.stdout
  failed_when: rails_app_pg_module_enable.rc != 0
  when: rails_app_postgresql_module | length > 0

- name: Install Satellite Ruby gems using Satellite repo plus RHEL dependency repos
  ansible.builtin.dnf:
    name: "{{ rails_app_satellite_rubygems }}"
    state: present
  register: rails_app_rubygem_install