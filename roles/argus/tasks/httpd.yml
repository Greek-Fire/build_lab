- name: Configure Apache virtual host
  ansible.builtin.template:
    src: httpd-argus.conf.j2
    dest: "{{ argus_httpd_conf }}"
    owner: root
    group: root
    mode: "0640"
  notify: Restart httpd

- name: Create httpd override directory
  ansible.builtin.file:
    path: "/etc/systemd/system/httpd.service.d"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Configure httpd ordering override
  ansible.builtin.template:
    src: httpd-argus-override.conf.j2
    dest: /etc/systemd/system/httpd.service.d/argus.conf
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reload systemd
    - Restart httpd

- name: Open only HTTPS in firewalld
  ansible.posix.firewalld:
    service: https
    permanent: true
    immediate: true
    state: enabled