- name: Configure Rails database.yml
  ansible.builtin.template:
    src: database.yml.j2
    dest: "{{ argus_home }}/config/database.yml"
    owner: "{{ argus_user }}"
    group: "{{ argus_group }}"
    mode: "0640"

- name: Configure Puma
  ansible.builtin.template:
    src: puma.rb.j2
    dest: "{{ argus_home }}/config/puma.rb"
    owner: "{{ argus_user }}"
    group: "{{ argus_group }}"
    mode: "0640"
  notify: Restart Argus 

- name: Configure Argus systemd service
  ansible.builtin.template:
    src: argus.service.j2
    dest: /etc/systemd/system/argus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Argus
- include_tasks: certs.yml
- include_tasks: httpd.yml

- name: Check Puma runtime directory SELinux fcontext
  ansible.builtin.command:
    cmd: semanage fcontext -l
  register: selinux_fcontexts
  changed_when: false

- name: Label Puma runtime directory for Apache socket proxy access
  ansible.builtin.command:
    cmd: semanage fcontext -a -t httpd_var_run_t '{{ argus_puma_socket_path }}(/.*)?'
  when: argus_puma_socket_path ~ '(/.*)?' not in selinux_fcontexts.stdout
  notify: Restore Puma runtime SELinux context