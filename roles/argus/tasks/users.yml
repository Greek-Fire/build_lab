- name: Ensure rails service group exists
  ansible.builtin.group:
    name: argus 
    system: true
    state: present

- name: Ensure rails service user exists and cannot log in
  ansible.builtin.user:
    name: argus 
    group: argus 
    append: true
    home: "{{ argus_home_path }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true
    password_lock: true
    state: present

- name: Add rails user to redis group for Unix socket access
  ansible.builtin.user:
    name: argus 
    groups: redis 
    append: true
